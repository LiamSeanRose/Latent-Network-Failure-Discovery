[project]
name = "cassandra"
version = "0.0.0"
description = "Proactive discovery of latent, timing-dependent network failure modes"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cassandra"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["."]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "ANN",  # missing type annotations — PROJECT.md rule: type hints everywhere
    "RUF",  # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["cassandra"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN201"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
