[project]
name = "cassandra"
version = "0.0.0"
description = "Proactive discovery of latent, timing-dependent network failure modes"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []
keywords = [
    "network",
    "configuration-analysis",
    "static-analysis",
    "vrrp",
    "hsrp",
    "arista-eos",
    "cisco-ios",
    "timers",
    "failure-analysis",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Telecommunications Industry",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
    "Topic :: System :: Networking :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/LiamSeanRose/Latent-Network-Failure-Discovery"
Repository = "https://github.com/LiamSeanRose/Latent-Network-Failure-Discovery"
Issues = "https://github.com/LiamSeanRose/Latent-Network-Failure-Discovery/issues"
Documentation = "https://github.com/LiamSeanRose/Latent-Network-Failure-Discovery/blob/main/docs/INSTALL.md"

[project.scripts]
cassandra = "cassandra.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# One root, so every subpackage under it ships. tests/test_packaging.py holds
# this to every package directory that exists on disk.
packages = ["cassandra"]

[tool.hatch.build.targets.sdist]
# The source distribution is published surface: it carries the spec, the docs, the
# corpus and the tests, but not repository-local scaffolding.
exclude = [".github", "CLAUDE.md"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["."]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "ANN",  # missing type annotations — PROJECT.md rule: type hints everywhere
    "RUF",  # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["cassandra"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN201"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
