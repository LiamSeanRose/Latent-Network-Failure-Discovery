# Two FRR routers on one segment, contesting a VRRP group.
#
# The macvlan device FRR requires is NOT created here. It was, via containerlab
# `exec`, and it silently did not happen — the first CI run showed no macvlan and
# zero advertisements sent, with nothing in the logs to say why. Setup that can
# fail invisibly does not belong in a topology file, so the workflow does it in
# explicit steps that print their output and fail loudly.
name: frr-vrrp-election

topology:
  kinds:
    linux:
      image: quay.io/frrouting/frr:10.2.1
      memory: 256Mb
      cpu: 0.5

  nodes:
    r1:
      kind: linux
      binds:
        - r1/daemons:/etc/frr/daemons
        - r1/frr.conf:/etc/frr/frr.conf
    r2:
      kind: linux
      binds:
        - r2/daemons:/etc/frr/daemons
        - r2/frr.conf:/etc/frr/frr.conf

  links:
    - endpoints: ["r1:eth1", "r2:eth1"]
