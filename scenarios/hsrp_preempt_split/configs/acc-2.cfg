! acc-2 -- access switch, pure layer 2. Same build as acc-1; the two exist so
! the corpus has more than one thing hanging off the distribution pair.
!
version 9.3(10)
hostname acc-2
!
feature lldp
!
no password strength-check
!
banner motd ^
Authorised use only. Sessions are recorded.
^
!
vlan 120
  name user-data
vlan 220
  name user-voice
!
interface Ethernet1/1
  description uplink to dist-1
  switchport
  switchport mode trunk
  switchport trunk allowed vlan 120,220
  no shutdown
!
interface Ethernet1/2
  description uplink to dist-2
  switchport
  switchport mode trunk
  switchport trunk allowed vlan 120,220
  no shutdown
!
interface Ethernet1/3
  description desk port
  switchport
  switchport mode access
  switchport access vlan 120
  spanning-tree port type edge
  no shutdown
!
interface Ethernet1/4
  description desk phone
  switchport
  switchport mode access
  switchport access vlan 220
  spanning-tree port type edge
  no shutdown
!
interface Ethernet1/5
  description meeting room dock
  switchport
  switchport mode access
  switchport access vlan 120
  spanning-tree port type edge
  no shutdown
!
logging server 172.16.250.20 6
!
ntp server 172.16.250.30 prefer
!
snmp-server contact netops
snmp-server location campus building 4
!
line vty
  exec-timeout 15
