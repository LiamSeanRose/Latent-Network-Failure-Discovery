! dist-1 -- intended HSRP active for both user groups.
!
! The defect lives in the two groups below. Group 120 and group 220 track the
! same uplink and lose the same 35 points when it fails, so they leave together.
! Only group 220 was given a preempt delay, so they do not come back together.
!
version 9.3(10)
hostname dist-1
!
feature interface-vlan
feature hsrp
!
no password strength-check
!
banner motd ^
Authorised use only. Sessions are recorded.
^
!
ip access-list CORE-IN
  10 permit ip 172.16.0.0/16 any
  20 deny ip any any log
!
vlan 120
  name user-data
vlan 220
  name user-voice
vlan 900
  name dist-transit
!
track 10 interface Ethernet1/1 line-protocol
!
interface loopback0
  description router id
  ip address 172.16.255.1/32
  ip router ospf 1 area 0.0.0.0
!
interface Ethernet1/1
  description uplink to campus core -- tracked, flap target
  no switchport
  ip address 172.16.240.1/30
  ip router ospf 1 area 0.0.0.0
  no shutdown
!
interface Ethernet1/2
  description peer link to dist-2
  switchport
  switchport mode trunk
  switchport trunk allowed vlan 120,220,900
  no shutdown
!
interface Ethernet1/3
  description to acc-1
  switchport
  switchport mode trunk
  switchport trunk allowed vlan 120,220
  no shutdown
!
interface Ethernet1/4
  description to acc-2
  switchport
  switchport mode trunk
  switchport trunk allowed vlan 120,220
  no shutdown
!
interface Vlan120
  description user data
  no shutdown
  ip address 172.16.120.2/24
  ip router ospf 1 area 0.0.0.0
  ip ospf passive-interface
  hsrp version 2
  hsrp 120
    ip 172.16.120.1
    priority 120
    preempt
    timers 1 3
    track 10 decrement 35
!
interface Vlan220
  description user voice
  no shutdown
  ip address 172.16.220.2/24
  ip router ospf 1 area 0.0.0.0
  ip ospf passive-interface
  hsrp version 2
  hsrp 220
    ip 172.16.220.1
    priority 120
    preempt delay minimum 45
    timers 1 3
    track 10 decrement 35
!
interface Vlan900
  description transit to dist-2
  no shutdown
  ip address 172.16.9.1/30
  ip router ospf 1 area 0.0.0.0
!
router ospf 1
  router-id 172.16.255.1
  log-adjacency-changes
!
logging server 172.16.250.20 6
logging level local7 5
!
ntp server 172.16.250.30 prefer
ntp server 172.16.250.31
!
snmp-server contact netops
snmp-server location campus building 4
!
line vty
  exec-timeout 15
