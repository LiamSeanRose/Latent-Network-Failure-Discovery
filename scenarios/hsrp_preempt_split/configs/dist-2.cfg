! dist-2 -- intended HSRP standby for both user groups.
!
! Deliberately plain: priority 100 on both groups, preempt with no delay, no
! uplink tracking. Every asymmetry the scenario turns on is on dist-1.
!
version 9.3(10)
hostname dist-2
!
feature interface-vlan
feature hsrp
!
no password strength-check
!
banner motd ^
Authorised use only. Sessions are recorded.
^
!
ip access-list CORE-IN
  10 permit ip 172.16.0.0/16 any
  20 deny ip any any log
!
vlan 120
  name user-data
vlan 220
  name user-voice
vlan 900
  name dist-transit
!
interface loopback0
  description router id
  ip address 172.16.255.2/32
  ip router ospf 1 area 0.0.0.0
!
interface Ethernet1/1
  description uplink to campus core
  no switchport
  ip address 172.16.240.5/30
  ip router ospf 1 area 0.0.0.0
  no shutdown
!
interface Ethernet1/2
  description peer link to dist-1
  switchport
  switchport mode trunk
  switchport trunk allowed vlan 120,220,900
  no shutdown
!
interface Ethernet1/3
  description to acc-1
  switchport
  switchport mode trunk
  switchport trunk allowed vlan 120,220
  no shutdown
!
interface Ethernet1/4
  description to acc-2
  switchport
  switchport mode trunk
  switchport trunk allowed vlan 120,220
  no shutdown
!
interface Vlan120
  description user data
  no shutdown
  ip address 172.16.120.3/24
  ip router ospf 1 area 0.0.0.0
  ip ospf passive-interface
  hsrp version 2
  hsrp 120
    ip 172.16.120.1
    priority 100
    preempt
    timers 1 3
!
interface Vlan220
  description user voice
  no shutdown
  ip address 172.16.220.3/24
  ip router ospf 1 area 0.0.0.0
  ip ospf passive-interface
  hsrp version 2
  hsrp 220
    ip 172.16.220.1
    priority 100
    preempt
    timers 1 3
!
interface Vlan900
  description transit to dist-1
  no shutdown
  ip address 172.16.9.2/30
  ip router ospf 1 area 0.0.0.0
!
router ospf 1
  router-id 172.16.255.2
  log-adjacency-changes
!
logging server 172.16.250.20 6
logging level local7 5
!
ntp server 172.16.250.30 prefer
ntp server 172.16.250.31
!
snmp-server contact netops
snmp-server location campus building 4
!
line vty
  exec-timeout 15
