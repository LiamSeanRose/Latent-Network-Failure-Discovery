! acc1 — pure L2. Carries the three VLANs between the aggregation pair and
! provides the client access port. No SVIs, no routing: it must not be able to
! influence the VRRP election it is transporting.
hostname acc1
!
no ip routing
!
vlan 14,24,34,99
!
interface Ethernet1
   description to agg-a
   switchport mode trunk
   switchport trunk allowed vlan 14,24,34,99
!
interface Ethernet2
   description to agg-b
   switchport mode trunk
   switchport trunk allowed vlan 14,24,34,99
!
interface Ethernet3
   description client1
   switchport mode access
   switchport access vlan 14
   spanning-tree portfast
!
end
