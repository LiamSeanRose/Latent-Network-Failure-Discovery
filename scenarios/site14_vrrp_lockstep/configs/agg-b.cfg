! agg-b — intended VRRP backup for all three groups.
!
! Deliberately plain: no tracking, no preempt delay, priority 100 everywhere.
! All the asymmetry that produces the failure lives on agg-a.
!
hostname agg-b
!
ip routing
!
vlan 14,24,34
!
interface Loopback0
   ip address 10.255.1.2/32
!
interface Ethernet1
   description uplink to core1
   no switchport
   ip address 10.0.0.3/31
!
interface Ethernet2
   description to acc1
   switchport mode trunk
   switchport trunk allowed vlan 14,24,34
!
interface Vlan14
   description clients
   ip address 10.14.0.3/24
   vrrp 14 ipv4 10.14.0.1
   vrrp 14 priority-level 100
   vrrp 14 preempt
   vrrp 14 advertisement interval 1
!
interface Vlan24
   description voice
   ip address 10.24.0.3/24
   vrrp 24 ipv4 10.24.0.1
   vrrp 24 priority-level 100
   vrrp 24 preempt
   vrrp 24 advertisement interval 1
!
interface Vlan34
   description management
   ip address 10.34.0.3/24
   vrrp 34 ipv4 10.34.0.1
   vrrp 34 priority-level 100
   vrrp 34 preempt
   vrrp 34 advertisement interval 1
!
router ospf 1
   router-id 10.255.1.2
   network 10.0.0.2/31 area 0.0.0.0
   network 10.14.0.0/24 area 0.0.0.0
   network 10.24.0.0/24 area 0.0.0.0
   network 10.34.0.0/24 area 0.0.0.0
   passive-interface Vlan14
   passive-interface Vlan24
   passive-interface Vlan34
!
end
