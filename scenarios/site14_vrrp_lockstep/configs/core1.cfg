! core1 — upstream L3, and the probe destination.
hostname core1
!
ip routing
!
interface Loopback0
   description probe target
   ip address 10.255.0.1/32
!
interface Ethernet1
   description to agg-a
   no switchport
   ip address 10.0.0.0/31
!
interface Ethernet2
   description to agg-b
   no switchport
   ip address 10.0.0.2/31
!
router ospf 1
   router-id 10.255.0.1
   network 10.0.0.0/31 area 0.0.0.0
   network 10.0.0.2/31 area 0.0.0.0
   network 10.255.0.1/32 area 0.0.0.0
!
end
