! agg-a — intended VRRP master for all three groups.
!
! The scenario lives in the asymmetry between the three groups below. It is the
! kind of asymmetry that accumulates from piecemeal changes over years, and no
! single line of it is wrong on its own:
!
!   group 14  tracks the uplink, preempts back immediately
!   group 24  tracks the uplink, waits 90s before preempting back
!   group 34  does not track the uplink at all
!
hostname agg-a
!
ip routing
!
vlan 14,24,34,99
!
track UPLINK interface Ethernet1 line-protocol
!
interface Loopback0
   ip address 10.255.1.1/32
!
interface Ethernet1
   description uplink to core1 -- TRACKED, flap target
   no switchport
   ip address 10.0.0.1/31
!
interface Ethernet2
   description to acc1
   switchport mode trunk
   switchport trunk allowed vlan 14,24,34,99
!
interface Vlan99
   description transit to peer aggregation router
   ip address 10.99.0.1/30
   ip ospf network point-to-point
!
interface Vlan14
   description clients
   ip address 10.14.0.2/24
   vrrp 14 ipv4 10.14.0.1
   vrrp 14 priority-level 110
   vrrp 14 preempt
   vrrp 14 advertisement interval 1
   vrrp 14 tracked-object UPLINK decrement 40
!
interface Vlan24
   description voice
   ip address 10.24.0.2/24
   vrrp 24 ipv4 10.24.0.1
   vrrp 24 priority-level 110
   vrrp 24 preempt
   vrrp 24 preempt delay minimum 90
   vrrp 24 advertisement interval 1
   vrrp 24 tracked-object UPLINK decrement 40
!
interface Vlan34
   description management
   ip address 10.34.0.2/24
   vrrp 34 ipv4 10.34.0.1
   vrrp 34 priority-level 110
   vrrp 34 preempt
   vrrp 34 preempt delay minimum 90
   vrrp 34 advertisement interval 1
!
router ospf 1
   router-id 10.255.1.1
   network 10.0.0.0/31 area 0.0.0.0
   network 10.99.0.0/30 area 0.0.0.0
   network 10.14.0.0/24 area 0.0.0.0
   network 10.24.0.0/24 area 0.0.0.0
   network 10.34.0.0/24 area 0.0.0.0
   passive-interface Vlan14
   passive-interface Vlan24
   passive-interface Vlan34
!
end
