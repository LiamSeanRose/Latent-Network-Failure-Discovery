! edge1 — the router both sites reach the outside through.
hostname edge1
!
ip routing
!
interface Loopback0
   ip address 10.255.0.10/32
!
interface Ethernet1
   description to north-agg1
   no switchport
   ip address 10.0.10.0/31
!
interface Ethernet2
   description to north-agg2
   no switchport
   ip address 10.0.10.2/31
!
interface Ethernet3
   description to south-agg1
   no switchport
   ip address 10.0.20.0/31
!
router bgp 65010
   router-id 10.255.0.10
   neighbor 10.0.10.1 remote-as 65001
   neighbor 10.0.10.1 description north-agg1
   neighbor 10.0.20.1 remote-as 65003
   neighbor 10.0.20.1 description south-agg1
!
end
