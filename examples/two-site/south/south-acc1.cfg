! south-acc1 — access switch for the south site. Pure L2.
hostname south-acc1
!
no ip routing
!
vlan 30
!
interface Ethernet1
   description to south-agg1
   switchport mode trunk
   switchport trunk allowed vlan 30
!
interface Ethernet2
   description desk port
   switchport mode access
   switchport access vlan 30
   spanning-tree portfast
!
end
