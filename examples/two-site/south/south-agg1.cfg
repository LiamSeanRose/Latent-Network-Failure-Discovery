! south-agg1 — the only gateway at the south site.
hostname south-agg1
!
ip routing
!
vlan 30
!
interface Loopback0
   ip address 10.255.0.3/32
!
interface Ethernet1
   description uplink to edge1
   no switchport
   ip address 10.0.20.1/31
!
interface Ethernet2
   description to south-acc1
   switchport mode trunk
   switchport trunk allowed vlan 30
!
interface Vlan30
   description clients
   ip address 10.30.0.2/24
   vrrp 30 ipv4 10.30.0.1
   vrrp 30 priority-level 110
   vrrp 30 preempt
   vrrp 30 advertisement interval 1
!
router bgp 65003
   router-id 10.255.0.3
!
router ospf 1
   router-id 10.255.0.3
   network 10.0.20.0/31 area 0.0.0.0
   network 10.30.0.0/24 area 0.0.0.0
   passive-interface Vlan30
!
end
