! north-acc1 — access switch for the north site. Pure L2.
hostname north-acc1
!
no ip routing
!
vlan 10,20,99
!
interface Ethernet1
   description to north-agg1
   switchport mode trunk
   switchport trunk allowed vlan 10,99
!
interface Ethernet2
   description to north-agg2
   switchport mode trunk
   switchport trunk allowed vlan 10,99
!
interface Ethernet3
   description desk port
   switchport mode access
   switchport access vlan 10
   spanning-tree portfast
!
interface Ethernet4
   description desk phone
   switchport mode access
   switchport access vlan 20
   spanning-tree portfast
!
end
