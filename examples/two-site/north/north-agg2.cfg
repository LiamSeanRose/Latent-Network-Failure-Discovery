! north-agg2 — second-hop gateway for the north site, intended VRRP backup.
hostname north-agg2
!
ip routing
!
vlan 10,20,99
!
interface Loopback0
   ip address 10.255.0.2/32
!
interface Ethernet1
   description uplink to edge1
   no switchport
   ip address 10.0.10.3/31
!
interface Ethernet2
   description to north-acc1
   switchport mode trunk
   switchport trunk allowed vlan 10,20,99
!
interface Ethernet3
   description to north-agg1
   switchport mode trunk
   switchport trunk allowed vlan 10,20,99
!
interface Vlan99
   description transit to north-agg1
   ip address 10.99.0.2/30
   ip ospf network point-to-point
!
interface Vlan10
   description clients
   ip address 10.10.0.3/24
   vrrp 10 ipv4 10.10.0.1
   vrrp 10 priority-level 100
   vrrp 10 preempt
   vrrp 10 advertisement interval 1
!
interface Vlan20
   description voice
   ip address 10.20.0.3/24
   vrrp 20 ipv4 10.20.0.1
   vrrp 20 priority-level 100
   vrrp 20 preempt
   vrrp 20 advertisement interval 1
!
router ospf 1
   router-id 10.255.0.2
   network 10.99.0.0/30 area 0.0.0.0
   network 10.10.0.0/24 area 0.0.0.0
   network 10.20.0.0/24 area 0.0.0.0
   passive-interface Vlan10
   passive-interface Vlan20
!
end
