! north-agg1 — first-hop gateway for the north site, intended VRRP master.
hostname north-agg1
!
ip routing
!
vlan 10,20,99
!
track UPLINK interface Ethernet1 line-protocol
!
interface Loopback0
   ip address 10.255.0.1/32
!
interface Ethernet1
   description uplink to edge1
   no switchport
   ip address 10.0.10.1/31
!
interface Ethernet2
   description to north-acc1
   switchport mode trunk
   switchport trunk allowed vlan 10,20,99
!
interface Ethernet3
   description to north-agg2
   switchport mode trunk
   switchport trunk allowed vlan 10,20,99
!
interface Vlan99
   description transit to north-agg2
   ip address 10.99.0.1/30
   ip ospf network point-to-point
!
interface Vlan10
   description clients
   ip address 10.10.0.2/24
   vrrp 10 ipv4 10.10.0.1
   vrrp 10 priority-level 110
   vrrp 10 preempt
   vrrp 10 advertisement interval 1
   vrrp 10 tracked-object UPLINK decrement 40
!
interface Vlan20
   description voice
   ip address 10.20.0.2/24
   vrrp 20 ipv4 10.20.0.1
   vrrp 20 priority-level 110
   vrrp 20 preempt
   vrrp 20 preempt delay minimum 60
   vrrp 20 advertisement interval 1
   vrrp 20 tracked-object UPLINK decrement 40
!
router bgp 65001
   router-id 10.255.0.1
   neighbor 10.0.10.0 remote-as 65010
   neighbor 10.0.10.0 description edge1
!
router ospf 1
   router-id 10.255.0.1
   network 10.99.0.0/30 area 0.0.0.0
   network 10.10.0.0/24 area 0.0.0.0
   network 10.20.0.0/24 area 0.0.0.0
   passive-interface Vlan10
   passive-interface Vlan20
!
end
