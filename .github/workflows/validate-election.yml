# Partial Phase 4: check the election half of the TIMING model against FRR.
#
# Free images only, so this runs on every push. It does not validate interface
# tracking or preempt delay — FRR implements neither — so it narrows the
# unvalidated surface rather than closing it. See the scenario README.
name: validate-election

# Manual dispatch until it has passed once. The cause of the first two failures is
# understood and fixed (missing NET_ADMIN on the macvlan creation), but a workflow
# that has never gone green does not belong on the push path.
on:
  workflow_dispatch:

jobs:
  election:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: scenarios/frr_vrrp_election
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
        working-directory: .

      - name: install containerlab
        run: bash -c "$(curl -sL https://get.containerlab.dev)"

      - name: deploy
        run: sudo containerlab deploy -t topology.clab.yml

      # FRR's vrrpd will not start a group until a macvlan with the RFC virtual
      # MAC (00:00:5e:00:01:<vrid>) exists on the parent interface.
      #
      # `--privileged` on the exec is load-bearing. Without it this fails with
      # "RTNETLINK answers: Operation not permitted" — the node does not carry
      # NET_ADMIN, and creating a macvlan needs it. Reproduced locally against the
      # same image: identical command succeeds with the capability and fails
      # without it. That was what killed the first two runs.
      - name: create the macvlan devices FRR requires
        run: |
          set -euxo pipefail
          for node in r1 r2; do
            c="clab-frr-vrrp-election-$node"
            sudo docker exec --privileged "$c" \
              ip link add vrrp4-14 link eth1 type macvlan mode bridge
            sudo docker exec --privileged "$c" \
              ip link set dev vrrp4-14 address 00:00:5e:00:01:0e
            sudo docker exec --privileged "$c" ip link set dev vrrp4-14 up
            sudo docker exec "$c" ip -br link show vrrp4-14
          done

      - name: restart frr so vrrpd sees the macvlan
        run: |
          set -euxo pipefail
          for node in r1 r2; do
            sudo docker exec "clab-frr-vrrp-election-$node" \
              /usr/lib/frr/frrinit.sh restart
          done

      - name: confirm vrrpd is actually advertising before judging the model
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            if sudo docker exec clab-frr-vrrp-election-r1 vtysh -c 'show vrrp' \
                 | grep -qE 'Advertisements Tx \(v4\) +[1-9]'; then
              echo "vrrpd is advertising"; exit 0
            fi
            sleep 3
          done
          echo "vrrpd never advertised - the lab is broken, not the model"
          sudo docker exec clab-frr-vrrp-election-r1 vtysh -c 'show vrrp'
          exit 1

      - name: validate the model against it
        run: sudo python3 validate.py

      - name: capture lab state (always, before teardown)
        if: always()
        run: |
          echo "======== LAB STATE ========"
          for n in r1 r2; do
            echo "--- $n links ---"
            sudo docker exec "clab-frr-vrrp-election-$n" ip -br link show 2>&1 | tail -6 || true
            echo "--- $n vrrp ---"
            sudo docker exec "clab-frr-vrrp-election-$n" vtysh -c 'show vrrp' 2>&1 \
              | grep -E 'VRID|State|Priority|Advertisements Tx|Interface' | head -8 || true
          done
          echo "======== END LAB STATE ========"

      # Teardown runs BEFORE diagnostics and silently. Its output is verbose and
      # was burying the actual failure at the end of the log, which is the part
      # anyone reads first.
      - name: teardown
        if: always()
        run: sudo containerlab destroy -t topology.clab.yml --cleanup >/dev/null 2>&1 || true


